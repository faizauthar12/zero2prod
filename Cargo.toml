[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
config = "0.15.23"
serde = { version = "1.0.228", features = ["derive"]}
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
uuid = {version = "1.23.2", features = ["v4", "v7"]}

[dependencies.sqlx]
version = "0.9.0"
default-features = false
features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate"
]

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
